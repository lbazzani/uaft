# Configurazione nginx per ambiente di test dev.uaft.it
upstream dev_uaft_backend {
    server localhost:3010;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.uaft.it;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.uaft.it;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/dev.uaft.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.uaft.it/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Main location
    location / {
        proxy_pass http://dev_uaft_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Longer timeouts for dev server
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Next.js static files
    location /_next/static/ {
        proxy_pass http://dev_uaft_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js webpack HMR
    location /_next/webpack-hmr {
        proxy_pass http://dev_uaft_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Logs
    access_log /var/log/nginx/dev.uaft.it.access.log;
    error_log /var/log/nginx/dev.uaft.it.error.log;
}
